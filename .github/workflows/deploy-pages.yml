name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 (없으면 자동 생성)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 브라우저가 옛 js/css 를 캐시해 배포가 반영 안 되는 일을 막는다.
      # GitHub Pages 는 max-age 를 길게 주므로 파일 주소에 커밋 해시를 붙인다.
      - name: 캐시 무력화 (자산 주소에 커밋 해시 붙이기)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g" index.html

      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
