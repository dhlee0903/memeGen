<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>밈 생성기 — 관리자</title>
<meta name="robots" content="noindex" />
<script>
  // 편집기는 하나뿐이다. 관리자 화면은 같은 앱을 관리자 모드로 여는 주소일 뿐이다.
  location.replace('index.html?admin=1' + location.hash);
</script>
</head>
<body>
<p>관리자 모드로 이동합니다… <a href="index.html?admin=1">열리지 않으면 여기를 누르세요</a></p>
</body>
</html>
